name: Generate Bug-to-Verified Animation
# Slow, low-emphasis transitions with a strong VERIFIED terminal state.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_bug_to_verified.py"
      - ".github/workflows/bug-to-verified.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate animation
        run: python scripts/generate_bug_to_verified.py

      - name: Commit and push generated animation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git add assets/process/bug-to-verified.gif
            if git diff --cached --quiet; then
              echo "Animation is already up to date."
              exit 0
            fi
            git commit -m "Generate bug-to-verified QA animation"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --soft HEAD~1
          done

          echo "Could not push generated animation after 3 attempts."
          exit 1
