name: Generate 3D Contribution Profile

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh 3D contribution profile"
          git push origin HEAD:main
