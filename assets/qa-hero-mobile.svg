<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Kalp Shah — Manual QA Engineer</title>
  <desc id="desc">Kalp Shah Manual QA Engineer profile visual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  
  <rect width="720" height="980" rx="28" fill="url(#bg)"/>
  <circle cx="590" cy="120" r="190" fill="#58a6ff" opacity=".07"/>
  <text x="48" y="80" fill="#8b949e" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">QA PROFILE / 2026</text>
