  <text x="48" y="205" fill="#58a6ff" font-family="Arial,sans-serif" font-size="24" font-weight="700">MANUAL QA ENGINEER</text>
  <text x="48" y="254" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="18">Web · WordPress · Functional</text>
  <text x="48" y="284" fill="#c9d1d9" font-family="Arial,sans-serif" font-size="18">UI · Responsive · SEO · Regression</text>
  <rect x="48" y="340" width="624" height="120" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="72" y="375" fill="#8b949e" font-family="monospace" font-size="15">$ qa.run()</text>
  <text x="72" y="412" fill="#f0f6fc" font-family="monospace" font-size="17">find → reproduce → report</text>
  <text x="72" y="438" fill="#f0f6fc" font-family="monospace" font-size="17">fix → retest → verify</text>
  <g transform="translate(48 530)">
