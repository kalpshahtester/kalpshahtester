<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">QA Pipeline</title>
<desc id="desc">Vertical manual QA pipeline from test through verify.</desc>
<rect width="720" height="420" rx="18" fill="#0D1117"/>
<text x="360" y="36" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2">QA PIPELINE</text>
<path d="M360 82V382" stroke="#30363D" stroke-width="4" stroke-linecap="round"/>
<circle cx="360" cy="82" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="82" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="87" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">TEST</text><text x="312" y="87" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">01</text><path d="M355 102 L360 107 L365 102" fill="none" stroke="#58A6FF" stroke-width="2" opacity=".7"/><circle cx="360" cy="132" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="132" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="137" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">FIND</text><text x="312" y="137" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">02</text><path d="M355 152 L360 157 L365 152" fill="none" stroke="#58A6FF" stroke-width="2" opacity=".7"/><circle cx="360" cy="182" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="182" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="187" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">REPRODUCE</text><text x="312" y="187" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">03</text><path d="M355 202 L360 207 L365 202" fill="none" stroke="#58A6FF" stroke-width="2" opacity=".7"/><circle cx="360" cy="232" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="232" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="237" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">REPORT</text><text x="312" y="237" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">04</text><path d="M355 252 L360 257 L365 252" fill="none" stroke="#58A6FF" stroke-width="2" opacity=".7"/><circle cx="360" cy="282" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="282" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="287" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">FIX</text><text x="312" y="287" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">05</text><path d="M355 302 L360 307 L365 302" fill="none" stroke="#58A6FF" stroke-width="2" opacity=".7"/><circle cx="360" cy="332" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="332" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="337" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">RETEST</text><text x="312" y="337" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">06</text><path d="M355 352 L360 357 L365 352" fill="none" stroke="#58A6FF" stroke-width="2" opacity=".7"/><circle cx="360" cy="382" r="25" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><circle cx="360" cy="382" r="18" fill="#58A6FF" opacity=".10"/><text x="360" y="387" text-anchor="middle" fill="#C9D1D9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">VERIFY</text><text x="312" y="387" text-anchor="end" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">07</text>
<text x="360" y="410" text-anchor="middle" fill="#8B949E" font-family="Arial,Helvetica,sans-serif" font-size="11">FIND → REPRODUCE → REPORT → FIX → RETEST → VERIFY</text>
