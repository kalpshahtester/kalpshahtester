<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">QA Release Control — Kalp Shah Manual QA Engineer</title>
  <desc id="desc">A release gate visual showing PASS, FAIL, RETEST and VERIFIED states for web QA.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7f2"/><stop offset="1" stop-color="#e9ece6"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c8cec7" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#paper)"/>
  <rect width="1200" height="520" rx="22" fill="url(#grid)" opacity=".45"/>
  <rect x="44" y="38" width="1112" height="444" rx="16" fill="#fff" stroke="#20251f" stroke-width="3" filter="url(#shadow)"/>
  <path d="M44 100H1156" stroke="#20251f" stroke-width="3"/>
  <circle cx="78" cy="69" r="8" fill="#20251f"/><circle cx="106" cy="69" r="8" fill="#8a928a"/><circle cx="134" cy="69" r="8" fill="#c7cdc5"/>
  <text x="168" y="76" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#20251f">RELEASE CONTROL / QA-01</text>
  <text x="1095" y="76" text-anchor="end" font-family="monospace" font-size="15" fill="#596159">BUILD 2026.10</text>
  <text x="78" y="146" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#20251f">KALP SHAH</text>
  <text x="80" y="178" font-family="monospace" font-size="18" letter-spacing="3" fill="#596159">MANUAL QA ENGINEER / WEB QUALITY</text>
  <text x="80" y="222" font-family="Arial,sans-serif" font-size="17" fill="#20251f">Release gate: functional · UI · responsive · WordPress · SEO · regression</text>
  <g transform="translate(80 260)">
    <rect width="248" height="126" rx="12" fill="#f1f3ee" stroke="#20251f" stroke-width="2"/>
    <text x="20" y="30" font-family="monospace" font-size="14" fill="#596159">01 / TEST</text>
    <text x="20" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#20251f">PASS</text>
    <text x="20" y="101" font-family="monospace" font-size="13" fill="#596159">SCOPE CLEAR</text>
    <path d="M205 67l13 13 25-29" fill="none" stroke="#1d7a46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(348 260)">
    <rect width="248" height="126" rx="12" fill="#fff0ef" stroke="#20251f" stroke-width="2"/>
    <text x="20" y="30" font-family="monospace" font-size="14" fill="#596159">02 / DEFECT</text>
    <text x="20" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#20251f">FAIL</text>
    <text x="20" y="101" font-family="monospace" font-size="13" fill="#8a4d48">BUG DETECTED</text>
    <path d="M211 62l31 31M242 62l-31 31" stroke="#c33f35" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(616 260)">
    <rect width="248" height="126" rx="12" fill="#fff8df" stroke="#20251f" stroke-width="2"/>
    <text x="20" y="30" font-family="monospace" font-size="14" fill="#596159">03 / FIX</text>
    <text x="20" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#20251f">RETEST</text>
    <text x="20" y="101" font-family="monospace" font-size="13" fill="#866f21">VERIFY FIX</text>
    <path d="M214 72h30M229 57l15 15-15 15" fill="none" stroke="#b38a13" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(884 260)">
    <rect width="248" height="126" rx="12" fill="#edf5ff" stroke="#20251f" stroke-width="2"/>
    <text x="20" y="30" font-family="monospace" font-size="14" fill="#596159">04 / RELEASE</text>
    <text x="20" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#20251f">VERIFIED</text>
    <text x="20" y="101" font-family="monospace" font-size="13" fill="#46647d">QUALITY GATE PASSED</text>
    <path d="M205 76h34" stroke="#316f9e" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="80" y="438" font-family="monospace" font-size="14" fill="#596159">47 SCENARIOS  ·  62+ CASES  ·  282 EXECUTIONS  ·  EVIDENCE-DRIVEN QA</text>
  <text x="1120" y="438" text-anchor="end" font-family="monospace" font-size="14" font-weight="700" fill="#20251f">GATE / READY</text>
</svg>